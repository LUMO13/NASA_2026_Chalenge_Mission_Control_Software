
name: Build FPECS Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FPECS
        run: cargo build --release --locked -p desktop-gui

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FPECS-Windows-x64
          path: target/release/desktop-gui.exe
          if-no-files-found: error
